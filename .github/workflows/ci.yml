name: CI

# Runs on every push and every pull request
on:
  push:
  pull_request:

# Node 22 (current LTS), not 20: vitest 5 needs Node 22.12+, and Node 20 reached end of life
# in April 2026. Render is pinned to the same major version with NODE_VERSION=22 (docs/DEPLOY.md).
jobs:
  server:
    name: Server (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      # The tests download a MongoDB binary for the in-memory database; keep it between runs
      - name: Cache MongoDB binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('server/package-lock.json') }}

      - run: npm ci
      - run: npm run lint
      - run: npm test
        env:
          NODE_ENV: test

  client:
    name: Client (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
